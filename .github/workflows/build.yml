name: Samsung Exynos9820 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        model:
          - d2s
          - d2x
          - d2xks
        mode:
          - ksun
    runs-on: ubuntu-latest 

    steps:
    - name: Import kernel source
      uses: actions/checkout@v4  
      
    - name: Install required package
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git libssl-dev bc flex bison \
          libncurses5-dev libncurses-dev cpio zip unzip \
          python3 curl rsync kmod libelf-dev \
          lz4 tar openssl python3-pip \
          gcc clang
        wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb && sudo dpkg -i libtinfo5_6.3-2_amd64.deb   
    
    - name: Apply USB-Arsenal Kernel Patches (4.14)
      run: |
          git clone --depth=1 https://github.com/ravindu644/USB-Arsenal.git /tmp/USB-Arsenal/
          git apply /tmp/USB-Arsenal/kernel-patches/4.14/*.patch
    - name: Setting permission
      run: |    
        chmod +x build.sh
        chmod -R +x prebuilts/    

    - name: Cooking Kernel
      run: ./build.sh ${{ matrix.model }} ${{ matrix.mode }}

    - name : Upload flashable file
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.model }}_${{ matrix.mode }}_Kernel_File
        path: |
          prebuilts/GoRhanHee_Kernel_for_${{ matrix.model }}_${{ matrix.mode }}.zip
